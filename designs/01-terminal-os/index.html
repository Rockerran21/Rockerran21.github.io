/* ─────────────────────────  tokens  ───────────────────────── */
:root{
  --bg:#050705;
  --chrome0:#161b16; --chrome1:#0d110d;
  --scr0:#0a2011; --scr1:#061408; --scr2:#040d06;
  --g:#3dff77;            /* phosphor green   */
  --g-soft:#2fd45f;
  --dim:#4f9b63;          /* faded phosphor   */
  --dark:#1c3a26;
  --am:#ffb454;           /* amber highlight  */
  --err:#ff6952;
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px;
  --ease:cubic-bezier(.22,1,.36,1);
  --snap:cubic-bezier(.16,.84,.44,1);
  --glow-g:0 0 6px rgba(61,255,119,.28);
  --glow-am:0 0 6px rgba(255,180,84,.30);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
html{overflow:hidden}
body{
  height:100dvh;
  overflow:hidden;
  background:
    radial-gradient(1100px 720px at 50% -12%, #0c1a0e 0%, var(--bg) 62%),
    var(--bg);
  color:var(--g);
  font-family:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  display:flex;
  padding:clamp(6px,2.2vmin,30px);
  -webkit-font-smoothing:antialiased;
}
::selection{background:var(--g);color:#03130a;text-shadow:none}
:focus{outline:none}
:focus-visible{outline:2px solid var(--am);outline-offset:2px;border-radius:2px}
a{color:var(--am);text-decoration:underline;text-decoration-style:dotted;text-underline-offset:3px;text-shadow:var(--glow-am);transition:color .18s var(--ease)}
a:hover{color:#ffd18f;text-decoration-style:solid}

/* ─────────────────────────  window  ───────────────────────── */
.window{
  position:relative;
  display:flex;flex-direction:column;
  width:100%;max-width:1060px;height:100%;
  margin:auto;
  background:#0b0f0b;
  border:1px solid #1e281f;
  border-radius:14px;
  box-shadow:
    0 40px 90px rgba(0,0,0,.65),
    0 4px 18px rgba(0,0,0,.5),
    inset 0 1px 0 rgba(120,160,125,.10);
  overflow:hidden;
}
.chrome{
  flex:0 0 auto;
  display:flex;align-items:center;gap:var(--s3);
  height:38px;padding:0 var(--s4);
  background:linear-gradient(var(--chrome0),var(--chrome1));
  border-bottom:1px solid #000;
  user-select:none;
}
.dots{display:flex;gap:7px}
.dot{width:11px;height:11px;border-radius:3px;border:1px solid rgba(0,0,0,.6)}
.dot-r{background:#5c2b23}.dot-a{background:#5c4823}.dot-g{background:#23512f}
.chrome-title{
  flex:1;text-align:center;
  font-size:11px;letter-spacing:.14em;text-transform:lowercase;
  color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.pwr{display:flex;align-items:center;gap:6px;font-size:9px;letter-spacing:.2em;color:var(--dim)}
.led{width:7px;height:7px;border-radius:50%;background:var(--g);box-shadow:0 0 8px rgba(61,255,119,.9);animation:led 3.4s var(--ease) infinite}
@keyframes led{0%,92%,100%{opacity:1}96%{opacity:.35}}

/* ─────────────────────────  CRT  ───────────────────────── */
.crt{
  position:relative;flex:1 1 auto;min-height:0;
  background:radial-gradient(130% 120% at 50% 0%, var(--scr0) 0%, var(--scr1) 46%, var(--scr2) 100%);
  border-radius:0 0 2px 2px;
  animation:crtOn .55s var(--snap) both;
  transform-origin:50% 50%;
}
@keyframes crtOn{
  0%{transform:scale(1,.012);filter:brightness(4)}
  46%{transform:scale(1,.012);filter:brightness(4)}
  72%{transform:scale(1.015,.55);filter:brightness(1.9)}
  100%{transform:scale(1,1);filter:brightness(1)}
}
#screen{
  position:absolute;inset:0;
  overflow-y:auto;overflow-x:hidden;
  padding:clamp(14px,3vw,30px) clamp(14px,3.4vw,34px) clamp(18px,3vw,30px);
  font-size:13.5px;line-height:1.62;
  border-radius:18px/12px;
  scrollbar-width:thin;scrollbar-color:rgba(61,255,119,.28) transparent;
  overscroll-behavior:contain;
}
#screen::-webkit-scrollbar{width:10px}
#screen::-webkit-scrollbar-track{background:transparent}
#screen::-webkit-scrollbar-thumb{background:rgba(61,255,119,.22);border-radius:8px;border:3px solid transparent;background-clip:padding-box}
#screen::-webkit-scrollbar-thumb:hover{background:rgba(61,255,119,.45);border:3px solid transparent;background-clip:padding-box}
/* overlays */
.fx{position:absolute;inset:0;pointer-events:none;border-radius:inherit}
.fx-scan{
  background:repeating-linear-gradient(0deg, rgba(0,0,0,.17) 0 1px, transparent 1px 3px);
  mix-blend-mode:multiply;
}
.fx-vig{
  background:radial-gradient(ellipse 92% 88% at 50% 48%, transparent 58%, rgba(0,0,0,.42) 100%);
}
.fx-glare{
  background:linear-gradient(112deg, rgba(190,255,205,.05) 0%, transparent 26%);
}
.fx-roll{
  overflow:hidden;
}
.fx-roll::before{
  content:"";position:absolute;left:0;right:0;height:140px;top:-160px;
  background:linear-gradient(180deg, transparent, rgba(120,255,160,.045) 50%, transparent);
  animation:roll 8s linear infinite;
}
@keyframes roll{0%{transform:translateY(0)}100%{transform:translateY(calc(100vh + 320px))}}
.fx-flick{background:rgba(160,255,190,.02);animation:flick 5s steps(3) infinite}
@keyframes flick{0%,100%{opacity:.35}33%{opacity:.9}66%{opacity:.15}}

/* ─────────────────────────  output  ───────────────────────── */
.ln{
  white-space:pre-wrap;overflow-wrap:anywhere;
  max-width:78ch;
  text-shadow:var(--glow-g);
  min-height:1.3em;
}
.ln.ind{padding-left:3ch}
.ln.ind2{padding-left:6ch}
.art{
  white-space:pre;overflow-x:auto;max-width:100%;
  font-family:inherit;line-height:1.35;
  text-shadow:var(--glow-g);
  scrollbar-width:none;
  margin:2px 0;

.art::-webkit-scrollbar{display:none}
.b{font-weight:700}
.am{color:var(--am);text-shadow:var(--glow-am)}
.dim{color:var(--dim);text-shadow:none}
.err{color:var(--err);text-shadow:0 0 6px rgba(255,105,82,.3)}
.ok{color:var(--g);font-weight:700}
.pu{color:var(--g);font-weight:700}
.tag{color:var(--am);text-shadow:var(--glow-am)}

  text-decoration:underline dotted;text-underline-offset:3px;
  text-shadow:var(--glow-am);
  transition:color .18s var(--ease);
}
.cmdlink:hover{color:#ffd18f;text-decoration:underline solid}

/* ─────────────────────────  prompt  ───────────────────────── */
#pline{position:relative;white-space:pre-wrap;overflow-wrap:anywhere;min-height:1.3em}
#pline.hidden{display:none}
#cmd{
  position:absolute;inset:0;width:100%;height:100%;
  opacity:0;border:0;background:transparent;color:transparent;
  font-size:16px; /* prevents iOS zoom */
  caret-color:transparent;cursor:text;
}
.cur{
  display:inline-block;width:.6em;height:1.12em;
  vertical-align:text-bottom;margin-left:1px;
  box-shadow:inset 0 0 0 1.5px var(--g);
  animation:none;
}
#pline.focused .cur{
  background:var(--g);box-shadow:0 0 8px rgba(61,255,119,.7);
  animation:blink 1.06s steps(1) infinite;
}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
#skiphint{
  position:absolute;left:0;right:0;bottom:10px;
  text-align:center;font-size:10.5px;letter-spacing:.22em;text-transform:uppercase;
  color:var(--dim);pointer-events:none;
  animation:hintpulse 1.8s var(--ease) infinite;
}
@keyframes hintpulse{0%,100%{opacity:.35}50%{opacity:.9}}

/* ─────────────────────────  chips  ───────────────────────── */
.chipbar{
  flex:0 0 auto;
  display:flex;align-items:center;gap:var(--s2);
  padding:var(--s2) var(--s3);
  background:linear-gradient(#0c110c,#090d09);
  border-top:1px solid #17211a;
  overflow-x:auto;overflow-y:hidden;
  scrollbar-width:none;
  -webkit-tap-highlight-color:transparent;
}
.chipbar::-webkit-scrollbar{display:none}
.chip{
  flex:0 0 auto;
  font:inherit;font-size:11.5px;
  color:var(--g);
  background:rgba(61,255,119,.06);
  border:1px solid rgba(61,255,119,.30);
  border-radius:6px;
  padding:5px 11px;
  cursor:pointer;
  white-space:nowrap;
  text-shadow:var(--glow-g);

.chip:hover{background:rgba(61,255,119,.15);border-color:rgba(61,255,119,.6);transform:translateY(-1px)}
.chip:active{transform:translateY(0)}
.chip-hot{
  color:var(--am);border-color:rgba(255,180,84,.45);background:rgba(255,180,84,.07);
  text-shadow:var(--glow-am);
}
.chip-hot:hover{background:rgba(255,180,84,.16);border-color:rgba(255,180,84,.75)}
.chip-label{flex:0 0 auto;font-size:9.5px;letter-spacing:.2em;color:var(--dim);text-transform:uppercase;padding-right:2px;user-select:none}

/* ─────────────────────────  status bar  ───────────────────────── */
.status{
  flex:0 0 auto;
  display:flex;align-items:center;justify-content:space-between;gap:var(--s3);
  padding:5px var(--s4);
  font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;
  color:var(--dim);
  background:#080b08;
  border-top:1px solid #141c15;
  user-select:none;white-space:nowrap;
}
.status .mid{color:var(--am);text-shadow:var(--glow-am);overflow:hidden;text-overflow:ellipsis}

/* ─────────────────────────  responsive  ───────────────────────── */
@media (max-width:640px){
  #screen{font-size:12px}
  .art{font-size:11px}
  .status .mid{display:none}
  .chrome-title{font-size:10px;letter-spacing:.08em}
  body{padding:6px}
  .window{border-radius:10px}
}
@media (max-width:400px){
  #screen{font-size:11.5px}
  .art{font-size:10.2px}
  .pwr span{display:none}
}
@media (min-width:1400px){
  #screen{font-size:14.5px}
  .window{max-width:1120px}
}

/* ─────────────────────────  reduced motion  ───────────────────────── */
@media (prefers-reduced-motion: reduce){
  .crt{animation:none}
  .fx-roll::before{animation:none;display:none}
  .fx-flick{display:none}
  .led{animation:none}
  #pline.focused .cur{animation:none;opacity:1}
  #skiphint{display:none}
  .chip{transition:none}
}
</style>

function execute(raw){
  var t = String(raw).trim();
  echo(raw);

    histIdx = hist.length; draft = '';

/* ═══════════════════════ completion ═══════════════════════ */
var CMD_NAMES = ['help','whoami','projects','writing','experience','education','certs','skills','contact','neofetch','exploit','history','clear','ls','cat','sudo','echo','date','pwd','uname','exit','hack','rm','man'];
var FILE_NAMES = ['projects/','projects/zero-trust','projects/pari','projects/vector','projects/healthcare','readme.md','writing.md','skills.txt','.flag'];
function lcp(arr){
  if(!arr.length){ return ''; }
  var p = arr[0];
  for(var i=1;i<arr.length;i++){
    while(arr[i].indexOf(p) !== 0){ p = p.slice(0,-1); if(!p){ return ''; } }
  }
  return p;
}
function complete(){
  var val = input.value;
  var m = val.match(/^(\s*\S+\s+)?(\S*)$/);
  if(!m){ return; }
  var head = m[1] || '', word = m[2] || '';
  var first = head.trim().toLowerCase();
  var pool, suffix = ' ';
  if(!head){
    pool = CMD_NAMES;
  }else if(first === 'cat' || first === 'ls' || first === 'less' || first === 'more'){
    pool = FILE_NAMES; suffix = '';
  }else if(first === 'sudo'){
    pool = ['hire-ranjan']; suffix = '';
  }else if(first === 'hack'){
    pool = ['the planet']; suffix = '';
  }else{
    return;
  }
  var cands = pool.filter(function(x){ return x.indexOf(word) === 0 && x !== word; });
  if(!cands.length){ return; }
  if(cands.length === 1){
    input.value = head + cands[0] + (cands[0].slice(-1) === '/' ? '' : suffix);
  }else{
    var p = lcp(cands);
    if(p && p !== word){
      input.value = head + p;
    }else{
      appendLine(ln('<span class="dim">' + cands.map(esc).join('   ') + '</span>'));
      scrollBot();
    }
  }
  typedEl.textContent = input.value;
}

/* ═══════════════════════ input wiring ═══════════════════════ */
input.addEventListener('input', function(){
  typedEl.textContent = input.value;
});
input.addEventListener('focus', function(){ pline.classList.add('focused'); });
input.addEventListener('blur',  function(){ pline.classList.remove('focused'); });
input.addEventListener('keydown', function(e){
  if(e.key === 'Enter'){
    e.preventDefault();
    run(input.value);
  }else if(e.key === 'ArrowUp'){
    e.preventDefault();
    if(histIdx === hist.length){ draft = input.value; }
    if(histIdx > 0){ histIdx--; input.value = hist[histIdx] || ''; typedEl.textContent = input.value; }
  }else if(e.key === 'ArrowDown'){
    e.preventDefault();
    if(histIdx < hist.length){
      histIdx++;
      input.value = (histIdx === hist.length) ? draft : (hist[histIdx] || '');
      typedEl.textContent = input.value;
    }
  }else if(e.key === 'Tab'){
    e.preventDefault();
    complete();
  }else if(e.key === 'l' && e.ctrlKey){
    e.preventDefault();
    out.innerHTML = '';
  }else if(e.key === 'c' && e.ctrlKey && !e.metaKey){
    e.preventDefault();
    appendLine(ln('<span class="pu">visitor@no0bos</span><span class="dim">:</span><span class="am">~</span><span class="dim">$</span> ' + esc(input.value) + '<span class="dim">^C</span>'));
    input.value = ''; typedEl.textContent = ''; histIdx = hist.length;
    scrollBot();
  }
});

crtEl.addEventListener('pointerdown', function(e){
  if(booting){ return; }
  if(e.target && e.target.closest && e.target.closest('a,button,input')){ return; }
  var sel = window.getSelection && window.getSelection();
  if(sel && String(sel).length){ return; }

});

window.addEventListener('keydown', function(e){
  if(booting){ skipAll = true; return; }
  if(d.activeElement === input){ return; }
  if(e.metaKey || e.ctrlKey || e.altKey){ return; }
  if(e.key && (e.key.length === 1 || e.key === 'Backspace' || e.key === 'Enter')){
    input.focus({preventScroll:true});
  }
});
window.addEventListener('pointerdown', function(){
  if(booting){ skipAll = true; }
}, {capture:true});

/* command buttons inside output */
out.addEventListener('click', function(e){
  var b = e.target && e.target.closest ? e.target.closest('button[data-cmd]') : null;
  if(b && b.dataset && b.dataset.cmd){ run(b.dataset.cmd); }
});
/* chips */
if(chipsEl){
  chipsEl.addEventListener('pointerdown', function(e){
    var b = e.target && e.target.closest ? e.target.closest('button[data-cmd]') : null;
    if(b){ e.preventDefault(); } /* don't steal focus / pop keyboard */
  });
  chipsEl.addEventListener('click', function(e){
    var b = e.target && e.target.closest ? e.target.closest('button[data-cmd]') : null;
    if(b && b.dataset && b.dataset.cmd){ run(b.dataset.cmd); }
  });
}

/* ═══════════════════════ status bar ═══════════════════════ */
function pad2(n){ return String(n).padStart(2,'0'); }
function tick(){
  if(clockEl){
    var now = new Date();
    clockEl.textContent = pad2(now.getHours()) + ':' + pad2(now.getMinutes()) + ':' + pad2(now.getSeconds());
  }
  if(upEl){
    var s = Math.floor((Date.now() - T0) / 1000);
    var h = Math.floor(s/3600), m = Math.floor((s%3600)/60), ss = s%60;
    upEl.textContent = 'up ' + (h ? pad2(h) + ':' : '') + pad2(m) + ':' + pad2(ss);
  }
}
tick();
setInterval(tick, 1000);

/* ═══════════════════════ boot sequence ═══════════════════════ */
function bootRow(label, delay){
  var pad = 36 - label.length;
  if(pad < 1){ pad = 1; }
  return ln(esc(label) + '<span class="dim">' + '&nbsp;'.repeat(pad) + '</span><span class="dim">[</span> <span class="ok">OK</span> <span class="dim">]</span>', '', delay != null ? delay : 55);
}

function typeInto(el, text, prefixHTML, msPerChar){
  var i = 0;
  return new Promise(function(resolve){
    function step(){
      if(RM || skipAll){ el.innerHTML = prefixHTML + esc(text); resolve(); return; }
      i++;
      el.innerHTML = prefixHTML + esc(text.slice(0, i));
      scrollBot();
      if(i >= text.length){ resolve(); }else{ setTimeout(step, msPerChar); }
    }
    step();
  });
}

function memCheck(){
  var el = appendLine(ln('Memory test: <span class="dim">000000K</span>'));
  var total = 262144;
  return new Promise(function(resolve){
    var v = 0;
    function step(){
      if(RM || skipAll || v >= total){
        el.innerHTML = 'Memory test: 262144K <span class="ok">OK</span> <span class="dim">— 240 ECTS verified</span>';
        scrollBot();
        resolve();
        return;
      }
      v = Math.min(total, v + 16384 + Math.floor(Math.random()*16384));
      el.innerHTML = 'Memory test: <span class="dim">' + String(v).padStart(6,'0') + 'K</span>';
      scrollBot();
      setTimeout(step, 16);
    }
    step();
  });
}

    ln('<span class="dim">aka</span> <span class="am b">No0bInj3ct3d</span> <span class="dim">· Bharatpur, Chitwan, Nepal</span>','',20),
    blank(),
    ln('<span class="am">&quot;I build LLM agents you can trust — and break the cloud they run on.&quot;</span>','',20),

    blank(),
    ln('<span class="dim">Last login: ' + esc(new Date().toDateString()) + ' from 10.13.37.42 (nice try)</span>','',20),

  ]);
}

function boot(){
  if(RM){
    /* dignified static entry: no boot theatre, straight to the terminal */
    if(skipHint && skipHint.parentNode){ skipHint.parentNode.removeChild(skipHint); }
    return motd().then(function(){
      booting = false;
      promptShow(true);
      if(!TOUCH){ input.focus({preventScroll:true}); }
    });
  }
  var p = printSeq([
    ln('<span class="am b">No0bOS BIOS v2.6.0</span> <span class="dim">— Phosphor Micro Systems</span>','',90),
    ln('<span class="dim">Copyright (C) 2026, Marasini Labs, Bharatpur</span>','',60),
    blank(),
    ln('CPU0 <span class="dim">:</span> AI &amp; Cloud Engineer @ 3.87GHz','',70),
    ln('CPU1 <span class="dim">:</span> Security Researcher @ 3.87GHz','',70)
  ]);
  p = p.then(memCheck);
  p = p.then(function(){
    return printSeq([
      blank(),
      bootRow('mounting /dev/skills', 60),
      bootRow('mounting /dev/coffee', 45),
      bootRow('insmod zero_trust.ko (SP 800-207)', 55),
      bootRow('insmod wazuh_siem.ko', 40),
      bootRow('insmod snort_ids.ko', 40),

      bootRow('adversary scan: 0 survivors', 70),
      bootRow('starting no0bsh on tty1', 60),
      blank()
    ]);
  });
  p = p.then(function(){
    var el = appendLine(ln(''));
    return typeInto(el, 'visitor', '<span class="dim">no0bos login:</span> ', 60);
  });
  p = p.then(function(){
    var el = appendLine(ln(''));
    return typeInto(el, '••••••••', '<span class="dim">password:</span> ', 34);
  });
  p = p.then(function(){ return sleep(260); });
  p = p.then(function(){
    out.innerHTML = '';
    skipAll = false; /* restore normal output pacing */
    if(skipHint && skipHint.parentNode){ skipHint.parentNode.removeChild(skipHint); }
    return motd();
  });
  p = p.then(function(){
    booting = false;
    promptShow(true);
    if(!TOUCH){ input.focus({preventScroll:true}); }
  });
  return p;
}

chain = chain.then(boot).catch(function(){
  /* if anything in boot theatre fails, still hand over a working shell */
  booting = false; skipAll = false;
  promptShow(true);
});
