<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:#04060a;overflow:hidden}
  body{color:#e8eef7;font-family:ui-monospace,"SF Mono","JetBrains Mono",Menlo,monospace}

  /* loader shown until the chosen design paints */
  #loader{position:fixed;inset:0;z-index:1;display:grid;place-items:center;
    background:radial-gradient(120% 120% at 50% 20%,#0a1620,#04060a 72%);
    transition:opacity .5s ease;pointer-events:none}
  #loader .dot{width:12px;height:12px;border-radius:50%;background:#4ef0b4;
    box-shadow:0 0 0 0 rgba(78,240,180,.6);animation:pulse 1.4s ease-out infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(78,240,180,.5);transform:scale(1)}
    70%{box-shadow:0 0 0 16px rgba(78,240,180,0);transform:scale(1.15)}
    100%{box-shadow:0 0 0 0 rgba(78,240,180,0);transform:scale(1)}}
  body.ready #loader{opacity:0}

  /* the design fills the whole viewport */
  #frame{position:fixed;inset:0;width:100%;height:100%;border:0;z-index:2;
    opacity:0;transition:opacity .55s ease;background:#04060a}
  body.ready #frame{opacity:1}

  /* unobtrusive, non-blocking cycle indicator (fades away on its own) */
  #hint{position:fixed;left:14px;top:14px;z-index:3;pointer-events:none;
    display:flex;align-items:center;gap:8px;
    padding:7px 12px;border-radius:999px;
    font-size:11.5px;letter-spacing:.3px;color:#bfe9d8;
    background:rgba(4,8,12,.66);border:1px solid rgba(78,240,180,.28);
    backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
    box-shadow:0 8px 26px -12px rgba(0,0,0,.8);
    opacity:0;transform:translateY(-6px);
    transition:opacity .4s ease,transform .4s ease}
  #hint.show{opacity:1;transform:none}
  #hint .d{width:7px;height:7px;border-radius:50%;background:#4ef0b4;box-shadow:0 0 8px rgba(78,240,180,.8)}
  #hint b{color:#eafff6;font-weight:600}
  #hint .k{color:#7f8ea2}

  @media (prefers-reduced-motion:reduce){
    #loader,#frame,#hint{transition:none}
    #loader .dot{animation:none}
  }

  noscript{position:fixed;inset:0;z-index:5;display:grid;place-items:center;text-align:center;padding:24px}
  noscript a{color:#4ef0b4}
</style>
</head>
<body>
  <div id="loader" aria-hidden="true"><span class="dot"></span></div>
  <iframe id="frame" title="Ranjan Marasini — portfolio" allow="fullscreen"></iframe>
  <div id="hint" role="status" aria-live="polite">
    <span class="d"></span><span>Design <b id="hnum">1</b>/9</span>
    <span class="k">· reload to cycle · <span id="hkeys">← →</span></span>
  </div>
  <noscript>
    <div>
      <p>This portfolio cycles through nine designs and needs JavaScript.</p>
      <p style="margin-top:10px"><a href="./designs/">Browse all nine designs →</a></p>
    </div>
  </noscript>

<script>
(function(){
  "use strict";
  var ORDER = [
    "01-terminal-os","02-attack-path","03-dossier","04-webgl-particles",
    "05-mission-control","06-editorial-light","07-neon-glitch",
    "08-voxel-world","09-signature"
  ];
  var TOTAL = ORDER.length;
  var KEY = "rm_design_idx_v1";

  function readNextIndex(){
    // First visit for this browser: start on a random design so different
    // visitors land differently. After that, advance sequentially each reload.
    try{
      var raw = localStorage.getItem(KEY);
      var idx = (raw === null)
        ? Math.floor(Math.random() * TOTAL)
        : (parseInt(raw, 10) + 1) % TOTAL;
      if (isNaN(idx) || idx < 0) idx = 0;
      localStorage.setItem(KEY, String(idx));
      return idx;
    }catch(e){
      return Math.floor(Math.random() * TOTAL); // private mode / storage blocked
    }
  }

  var idx = readNextIndex();

  var frame  = document.getElementById("frame");
  var loader = document.getElementById("loader");
  var hint   = document.getElementById("hint");
  var hnum   = document.getElementById("hnum");
  var isTouch = matchMedia("(hover:none)").matches;

  function label(){
    hnum.textContent = String(idx + 1);
    // On touch devices there is no keyboard; tell them the truth.
    document.getElementById("hkeys").textContent = isTouch ? "tap ↻ or reload" : "← →";
  }

  function load(i){
    idx = ((i % TOTAL) + TOTAL) % TOTAL;
    try{ localStorage.setItem(KEY, String(idx)); }catch(e){}
    document.body.classList.remove("ready");
    frame.src = "./designs/" + ORDER[idx] + "/";
    label();
    showHint();
  }

  var hintTimer;
  function showHint(){
    hint.classList.add("show");
    clearTimeout(hintTimer);
    hintTimer = setTimeout(function(){ hint.classList.remove("show"); }, 5200);
  }

  frame.addEventListener("load", function(){
    document.body.classList.add("ready");
    // Reflect the live design's own <title> (same-origin, so this is allowed).
    try{
      var t = frame.contentDocument && frame.contentDocument.title;
      if (t) document.title = t;
    }catch(e){}
    // Let keyboard shortcuts work even when focus is inside the design.
    try{
      var doc = frame.contentDocument;
      if (doc) doc.addEventListener("keydown", onKey);
    }catch(e){}
  });

  function onKey(e){
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    var tag = e.target && e.target.tagName;
    if (tag === "INPUT" || tag === "TEXTAREA" || (e.target && e.target.isContentEditable)) return;
    if (e.key === "ArrowRight"){ e.preventDefault(); load(idx + 1); }
    else if (e.key === "ArrowLeft"){ e.preventDefault(); load(idx - 1); }
    else if (e.key === "g" || e.key === "G"){ e.preventDefault(); window.location.href = "./designs/"; }
  }
  window.addEventListener("keydown", onKey);

  // Kick off
  label();
  frame.src = "./designs/" + ORDER[idx] + "/";
  showHint();

  // Safety: if a design is slow, reveal it anyway so we never sit on the loader.
  setTimeout(function(){ document.body.classList.add("ready"); }, 4000);
})();
</script>
